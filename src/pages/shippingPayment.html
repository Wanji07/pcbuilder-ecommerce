<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08121F">
    <meta name="description" content="B.Y.T.E. - Shipping & Payment">
    <title>B.Y.T.E. | Shipping & Payment</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/shop.css">
    <style>
        .checkout-container { max-width: 600px; margin: 40px auto; padding: 30px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .checkout-form label { display: block; margin-top: 15px; font-size: 0.9rem; color: #94a3b8; }
        .checkout-form input { width: 100%; padding: 12px; margin-top: 6px; background: #121f2f; border: 1px solid #2a3b52; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .checkout-btn { width: 100%; margin-top: 25px; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .checkout-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="home.html" class="logo" aria-label="B.Y.T.E. home">
            <img src="../assets/logo_dark.png" alt="B.Y.T.E. logo" width="150" height="37">
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="home.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="categories.html">Categories</a>
            <a href="aboutUs.html">About us</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="header-actions">
            <button type="button" class="cart-button" onclick="window.location.href='cart.html'" aria-label="Shopping cart">🛒</button>
            <button type="button" class="user-btn" onclick="window.location.href='login.html'" aria-label="Account">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
                </svg>
            </button>
            <span>Cart</span>
        </div>
    </header>

    <main>
        <div class="checkout-container">
            <h2>Shipping Information</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Where should we deliver your PC components?</p>

            <form id="shipping-form" class="checkout-form">
                <label for="street">Street Address / Barangay</label>
                <input type="text" id="street" placeholder="123 Katipunan Ave" required>

                <label for="city">City / Province</label>
                <input type="text" id="city" placeholder="Quezon City" required>

                <label for="postalCode">Postal Code</label>
                <input type="text" id="postalCode" placeholder="1108" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="09123456789" required>

                <button type="submit" class="checkout-btn">Save Shipping & Proceed</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <img src="../assets/logo_dark.png" alt="B.Y.T.E. logo">
            </div>
            <div class="footer-column">
                <h4>Explore</h4>
                <a href="shop.html">Shop components</a>
                <a href="categories.html">Categories</a>
                <a href="aboutUs.html">About us</a>
            </div>
            <div class="footer-column">
                <h4>Support</h4>
                <a href="contact.html">Contact us</a>
                <a href="shippingPayment.html">Shipping & Returns</a>
                <a href="contact.html">FAQ</a>
            </div>
            <div class="footer-column">
                <h4>Follow along</h4>
                <a href="#">Instagram · Facebook</a>
                <a href="#">TikTok · YouTube</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 B.Y.T.E. Build Your Tech Essentials.</p>
        </div>
    </footer>

    <!-- Global script for header visualizer/session checks -->
    <script src="../js/script.js" defer></script>
    <!-- Page-specific script for handling the address form submission -->
    <script src="../js/shippingPayment.js" defer></script>
</body>
</html>
