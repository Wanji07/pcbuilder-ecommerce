<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PCBuilder - Computer Parts and Accessories Store">
    <title>PCBuilder</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <a href="#" class="logo" aria-label="PCBuilder home">
            <span class="logo-mark">PB</span>
            <span>PCBuilder</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="#">Home</a>
            <a href="#" class="active">Shop</a>
            <a href="#">Categories</a>
            <a href="#">About us</a>
            <a href="#">Contact</a>
        </nav>

        <div class="header-actions">
            <button type="button" aria-label="Search">⌕</button>
            <button type="button" aria-label="Shopping cart">🛒</button>

            <button type="button" class="user-btn" aria-label="Account">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
                </svg>
            </button>

            <span>Cart</span>
        </div>
    </header>

    <main>
        <section id="hero" class="catalog-hero">
            <p class="hero-label">The catalog</p>
            <h1>Shop components.</h1>
            <p class="hero-description">
                Good parts. Clear specs. No guesswork.
            </p>
        </section>
    </main>

</body>
</html>
